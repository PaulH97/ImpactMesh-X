# @package _global_
# UTAE on the ImpactMesh original series: pre_month, pre_event, event_window,
# post_event. This is the rung between bi-temporal and the full series, and at
# the same time exactly the data product the ImpactMesh paper trains on --
# so the ladder 1/2/4/16 answers whether SITS contributes anything at all.
#
# On ImpactMesh these are the real original acquisitions (the four anchor dates
# land in 99.8-100% of the patches in the 16-frame stack, S1 and S2-clear). On
# Sen12Landslides there are no anchors; there select_timesteps picks by the
# same rule as for single-post/bi-temporal, with >= 30 days of distance for
# the two outer frames.

defaults:
  - override /model: utae

exp_nr: 2
exp_tag: quad-temporal

dataset:
  temporal_mode: quad-temporal

model:
  instance:
    fusion_stage: single
