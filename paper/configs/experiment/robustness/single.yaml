# @package _global_
# Experiment 4: Fusionsstufen unter atmosphaerischer Occlusion.
# S2-only Referenzzeile (keine Fusion) -- zeigt den reinen
# S2-Einbruch, gegen den die Fusionsstufen gehalten werden.
#
# Die S2-Variante (clear | cloudy | realistic) kommt als `dataset.s2_version`-
# Override aus all_runs.csv, nicht aus einer eigenen Dataset-Config. `clear`
# ist eine Spalte dieses Experiments -- die Clear-Referenz jeder Zeile wird also
# im selben Sweep mit identischer Config und identischen Seeds gerechnet, nicht
# aus exp2/exp3 geliehen.
#
# Gleiches Modell und gleicher temporal_mode (multi-temporal aus der
# Dataset-Config) wie die Fusionszeilen, kein accumulate_grad_batches-Override --
# gleicher effektiver Batch (8 auf ImpactMesh), damit die Zeile direkt gegen die
# Fusionsstufen lesbar ist.

defaults:
  - override /model: utae

exp_nr: 4
exp_tag: robustness_single

model:
  instance:
    fusion_stage: single
