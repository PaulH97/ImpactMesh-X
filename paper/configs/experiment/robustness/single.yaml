# @package _global_
# Experiment 4: fusion stages under atmospheric occlusion.
# S2-only reference row (no fusion) -- shows the raw S2 degradation that the
# fusion stages are compared against.
#
# The S2 variant (clear | cloudy | realistic) comes in as a `dataset.s2_version`
# override from all_runs.csv, not from a dedicated dataset config. `clear` is a
# column of this experiment -- so the clear reference of every row is computed
# in the same sweep with an identical config and identical seeds, not borrowed
# from exp2/exp3.
#
# Same model and same temporal_mode (multi-temporal from the dataset config)
# as the fusion rows, no accumulate_grad_batches override -- same effective
# batch (8 on ImpactMesh), so this row reads directly against the fusion
# stages.

defaults:
  - override /model: utae

exp_nr: 4
exp_tag: robustness_single

model:
  instance:
    fusion_stage: single
