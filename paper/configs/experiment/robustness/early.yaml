# @package _global_
# Experiment 4: fusion stages under atmospheric occlusion.
# Early fusion (channel concat before the first conv).
#
# The S2 variant (clear | cloudy | realistic) comes in as a `dataset.s2_version`
# override from all_runs.csv, not from a dedicated dataset config. `clear` is a
# column of this experiment -- so the clear reference of every row is computed
# in the same sweep with an identical config and identical seeds, not borrowed
# from exp2/exp3.
#
# Mirrors configs/experiment/fusion/early.yaml: same model, same temporal_mode
# (multi-temporal from the dataset config), no accumulate_grad_batches
# override -- same effective batch (8 on ImpactMesh) as in the fusion
# comparison on Sen12Landslides.

defaults:
  - override /model: utae

exp_nr: 4
exp_tag: robustness_early

model:
  instance:
    fusion_stage: early
