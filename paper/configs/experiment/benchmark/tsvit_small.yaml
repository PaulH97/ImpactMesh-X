# @package _global_
# TSViT benchmark — small datasets (128×128, Sen12Landslides)
# patch_size=8 -> 16×16 = 256 spatial tokens (matched to TSViT large for fair cross-dataset comparison).

defaults:
  - override /model: tsvit

exp_nr: 1
exp_tag: benchmark

model:
  img_size: ${dataset.img_size}
  max_seq_len: 15 
  patch_size: 8

datamodule:
  batch_size: 8
  num_workers: 8

trainer:
  accumulate_grad_batches: 2   # effective bs = 16