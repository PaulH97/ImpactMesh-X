# configs/model/tsvit.yaml
name: TSViT
warmup_epochs: 5 # Warmup for the temporal/spatial transformer (see lit_module/default.yaml).
instance:
  _target_: fusion.models.tsvit.TSViT
  num_bands: ${single_modality_channels:${dataset.modality_infos}}
  num_classes: ${dataset.num_classes}
  img_size: ${dataset.img_size}
  max_seq_len: 16
  patch_size: 8
  dim: 128
  temporal_depth: 6
  spatial_depth: 2
  heads: 4
  dim_head: 64
  scale_dim: 4
  dropout: 0.0
  emb_dropout: 0.0
  temporal_pe: relative
