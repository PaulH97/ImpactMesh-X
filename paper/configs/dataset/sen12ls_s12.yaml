# configs/dataset/sen12ls_s12.yaml
name: S12LS-S12
root: path/to/Sen12Landslides
task: S12LS-LD
version: harmonized
img_size: 128
num_classes: 2
num_timesteps: 15
temporal_mode: multi-temporal
modality_infos:
  S1DSC: {channels: 2, img_size: 128, temporal: true}
  S2: {channels: 10, img_size: 128, temporal: true}
splits_file: ${dataset.root}/tasks/${dataset.task}/${dataset.version}/splits_aligned.json
norm_json: ${dataset.root}/tasks/${dataset.task}/${dataset.version}/norm_aligned.json
lr: 1e-3
max_epochs: 75
