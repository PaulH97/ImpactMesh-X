# configs/dataset/impactmesh_fire.yaml
name: IM-Fire-S1
root: path/to/ImpactMesh-X/Fire
long_version: True
task: wildfire
img_size: 256
num_classes: 2
num_timesteps: 16
temporal_mode: multi-temporal
modality_infos:
  S1RTC: {channels: 2, img_size: 256, temporal: true}
split_json: ${dataset.root}/split/impactmesh_long_version_splits.json
norm_json: ${dataset.root}/split/impactmesh_long_version_norm.json
accum_steps: 2
# LR sweep experiment90 (val/mIoU, U-TAE, S1+S2, seeds 42/123): 3e-4 > 1e-4, 1e-3 worse.
lr: 3e-4
# Val plateau sits at ~epoch 18 (measured in experiment90, 50-epoch schedule);
max_epochs: 30